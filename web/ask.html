<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the Model</title>
<meta name="description" content="Ask a plain question about America's energy to 2050. The answer uses only numbers the open rebuild of EIA's model produced, each with where it came from.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NEMS Open">
<meta property="og:title" content="Ask the model about America's energy to 2050">
<meta property="og:description" content="Plain questions, answered only with numbers the open rebuild of EIA's model produced, each traced to its source.">
<meta property="og:image" content="https://nems.joshagarwal.com/og.png">
<meta property="og:url" content="https://nems.joshagarwal.com/ask">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%235DCAA5'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0e13;--panel:#131820;--panel2:#1a2029;--line:#252c37;--ink:#ece9e1;--ink2:#b3b0a7;--ink3:#86847c;--accent:#5DCAA5;--warn:#E8A33D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:780px;margin:0 auto;padding:26px 16px 10px}
h1{font-size:26px;margin:0 0 4px}
.lead{color:var(--ink2);margin:0 0 16px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;cursor:pointer}
#ask-go{background:var(--accent);color:#04342C;border:0;border-radius:10px;padding:0 20px;font-weight:650}
button:disabled,input:disabled{opacity:.55;cursor:default}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.ex button{font-size:13px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;text-align:left}
.fine{font-size:13px;color:var(--ink3);margin:10px 0 0}
.note-top{margin:0 0 12px;color:var(--ink2)}
code{font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
.out{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.out p,.out ul,.out ol{margin:0 0 10px}
.out sup a{color:var(--accent);text-decoration:none}
.chip{font-size:13.5px;border:1px solid var(--accent);border-radius:8px;padding:7px 10px}
.chip a{color:var(--accent)}
.outside{color:var(--ink2);font-style:italic}
.src{font-size:13px;color:var(--ink2)}
.src summary{cursor:pointer;color:var(--accent)}
.src ul{list-style:none;padding:0;margin:8px 0 0}
.src li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.src li .gd{margin:6px 0 0}
.basis{font-size:12.5px;color:var(--ink3)}
.err{color:var(--warn)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#legend{margin-top:14px}
@media(max-width:520px){form{flex-direction:column}#ask-go{padding:10px}}
</style>
<script defer src="site.js?v=12"></script>
<script defer src="ask.js?v=3"></script>
</head>
<body>
<main>
  <h1>Ask the model</h1>
  <p class="lead">Ask a plain question about energy in America to 2050. The model runs the scenario and answers with its own numbers, each one traced to where it came from.</p>
  <p id="ask-note" class="fine note-top"></p>
  <form id="ask-form" autocomplete="off">
    <input id="ask-q" type="text" maxlength="600" aria-label="Your question" placeholder="e.g. What does a $50 carbon price do to CO2 in 2040?">
    <button id="ask-go" type="submit">Ask</button>
  </form>
  <div id="ask-ex" class="ex" aria-label="Example questions"></div>
  <div id="ask-out" class="out" aria-live="polite" hidden></div>
  <div id="legend"></div>
</main>
</body>
</html>
