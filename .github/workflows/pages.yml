# Publish web/ (the policy sandbox) to GitHub Pages.
#
# Off until Josh turns it on. It runs only when started by hand (Actions tab, "Run
# workflow"), never on push, and it fails harmlessly until Pages is enabled in the repo
# settings (Settings > Pages > Source: GitHub Actions). Nothing is published without both.

name: Publish sandbox to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
